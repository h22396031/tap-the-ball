name: Build Tap The Ball APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/taptheball/game
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "TapTheBall"
          include ":app"
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.taptheball.game'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.taptheball.game'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.gms:play-services-ads:25.4.0'
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Tap The Ball</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="true">

                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713"/>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/taptheball/game/MainActivity.java <<'EOF'
          package com.taptheball.game;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.appcompat.app.AppCompatActivity;

          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.FullScreenContentCallback;
          import com.google.android.gms.ads.LoadAdError;
          import com.google.android.gms.ads.MobileAds;
          import com.google.android.gms.ads.interstitial.InterstitialAd;
          import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback;

          public class MainActivity extends AppCompatActivity {

              private InterstitialAd mInterstitialAd;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  MobileAds.initialize(this, initializationStatus -> {});

                  loadInterstitial();

                  WebView webView = new WebView(this);
                  webView.setWebViewClient(new WebViewClient());

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.addJavascriptInterface(new AndroidBridge(), "Android");

                  webView.loadUrl("https://h22396031.github.io/tap-the-ball/");

                  setContentView(webView);
              }

              private void loadInterstitial() {
                  AdRequest adRequest = new AdRequest.Builder().build();

                  InterstitialAd.load(
                          this,
                          "ca-app-pub-3940256099942544/1033173712",
                          adRequest,
                          new InterstitialAdLoadCallback() {

                              @Override
                              public void onAdLoaded(InterstitialAd interstitialAd) {
                                  mInterstitialAd = interstitialAd;

                                  mInterstitialAd.setFullScreenContentCallback(
                                          new FullScreenContentCallback() {
                                              @Override
                                              public void onAdDismissedFullScreenContent() {
                                                  mInterstitialAd = null;
                                                  loadInterstitial();
                                              }
                                          });
                              }

                              @Override
                              public void onAdFailedToLoad(LoadAdError adError) {
                                  mInterstitialAd = null;
                              }
                          });
              }

              private class AndroidBridge {

                  @JavascriptInterface
                  public void showInterstitial() {
                      runOnUiThread(() -> {
                          if (mInterstitialAd != null) {
                              mInterstitialAd.show(MainActivity.this);
                          }
                      });
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip
          ./gradle-8.10.2/bin/gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tap-the-ball-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk                          
