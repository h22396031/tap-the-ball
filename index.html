<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tap The Ball</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#07152e,#123f78);
    color:white;
    text-align:center;
    min-height:100vh;
}

.screen{
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.logo{
    font-size:55px;
    margin-bottom:5px;
}

.title{
    font-size:38px;
    font-weight:bold;
    margin:5px 0;
}

.subtitle{
    font-size:17px;
    opacity:.8;
    margin-bottom:30px;
}

.menu-card{
    width:100%;
    max-width:380px;
    background:rgba(255,255,255,.10);
    border-radius:25px;
    padding:25px;
    box-shadow:0 10px 35px rgba(0,0,0,.35);
    backdrop-filter:blur(10px);
}

.best{
    font-size:20px;
    margin-bottom:25px;
}

button{
    width:100%;
    padding:16px;
    margin:8px 0;
    border:0;
    border-radius:30px;
    font-size:19px;
    font-weight:bold;
    color:white;
    background:#087fdb;
}

.play{
    background:#00c853;
}

.settings{
    background:#6c4cff;
}

.back{
    background:#555;
}

#gameScreen{
    display:none;
    justify-content:flex-start;
}

.game-title{
    font-size:27px;
    margin:10px;
}

#info{
    width:100%;
    max-width:500px;
    display:flex;
    justify-content:space-around;
    font-size:16px;
    margin-bottom:8px;
}

#game{
    position:relative;
    width:94%;
    max-width:500px;
    height:65vh;
    background:linear-gradient(135deg,#1677ff,#00c6ff);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
}

#ball{
    position:absolute;
    width:65px;
    height:65px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%,white,#ff3b30 35%,#c40000);
    box-shadow:0 5px 15px rgba(0,0,0,.4);
    display:none;
}

#message{
    position:absolute;
    top:42%;
    width:100%;
    font-size:27px;
    font-weight:bold;
    line-height:1.5;
}

#startBtn{
    max-width:300px;
}

#settingsScreen{
    display:none;
}

.setting-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 5px;
    font-size:19px;
}

.toggle{
    width:65px;
    padding:8px;
    background:#00c853;
    font-size:14px;
}

</style>
</head>

<body>


<!-- HOME SCREEN -->

<div id="homeScreen" class="screen">

<div class="logo">🎮</div>

<div class="title">
Tap The Ball
</div>

<div class="subtitle">
Fast • Fun • Addictive
</div>

<div class="menu-card">

<div class="best">
🏆 Best Score:
<span id="homeBest">0</span>
</div>

<button class="play" onclick="showGame()">
▶ PLAY GAME
</button>

<button class="settings" onclick="showSettings()">
⚙️ SETTINGS
</button>

</div>

</div>



<!-- SETTINGS SCREEN -->

<div id="settingsScreen" class="screen">

<div class="menu-card">

<h2>⚙️ Settings</h2>

<div class="setting-row">

<span>🔊 Sound</span>

<button id="soundBtn"
class="toggle"
onclick="toggleSound()">
ON
</button>

</div>

<button class="back"
onclick="showHome()">
⬅ BACK
</button>

</div>

</div>



<!-- GAME SCREEN -->

<div id="gameScreen" class="screen">

<div class="game-title">
🎮 Tap The Ball
</div>

<div id="info">

<div>
🎯 <span id="score">0</span>
</div>

<div>
⏱️ <span id="time">30</span>
</div>

<div>
🔥 Level <span id="level">1</span>
</div>

<div>
❤️ <span id="lives">3</span>
</div>

</div>


<div id="game">

<div id="message">
Press Start!
</div>

<div id="ball"></div>

</div>


<button id="startBtn"
class="play"
onclick="startGame()">

START GAME

</button>


<button class="back"
onclick="showHome()">

⬅ HOME

</button>

</div>



<script>

let score=0;
let time=30;
let level=1;
let lives=3;

let playing=false;

let timer;
let moveTimer;

let soundOn=true;


const ball=document.getElementById("ball");

const game=document.getElementById("game");

const scoreText=document.getElementById("score");

const timeText=document.getElementById("time");

const levelText=document.getElementById("level");

const livesText=document.getElementById("lives");

const message=document.getElementById("message");

const bestText=document.getElementById("homeBest");


let bestScore=
localStorage.getItem("bestScore") || 0;

bestText.textContent=bestScore;



/* SOUND */

const audioContext=
new(window.AudioContext||
window.webkitAudioContext)();


function playSound(freq,duration){

if(!soundOn)return;

if(audioContext.state==="suspended"){
audioContext.resume();
}

const oscillator=
audioContext.createOscillator();

const gain=
audioContext.createGain();

oscillator.connect(gain);

gain.connect(
audioContext.destination
);

oscillator.frequency.value=freq;

oscillator.type="sine";

gain.gain.setValueAtTime(
0.2,
audioContext.currentTime
);

gain.gain.exponentialRampToValueAtTime(
0.001,
audioContext.currentTime+duration
);

oscillator.start();

oscillator.stop(
audioContext.currentTime+duration
);

}



/* SCREENS */

function showGame(){

document.getElementById(
"homeScreen"
).style.display="none";

document.getElementById(
"settingsScreen"
).style.display="none";

document.getElementById(
"gameScreen"
).style.display="flex";

}


function showHome(){

playing=false;

clearInterval(timer);

clearInterval(moveTimer);

ball.style.display="none";

document.getElementById(
"gameScreen"
).style.display="none";

document.getElementById(
"settingsScreen"
).style.display="none";

document.getElementById(
"homeScreen"
).style.display="flex";

bestText.textContent=
localStorage.getItem("bestScore") || 0;

}


function showSettings(){

document.getElementById(
"homeScreen"
).style.display="none";

document.getElementById(
"settingsScreen"
).style.display="flex";

}



/* SOUND TOGGLE */

function toggleSound(){

soundOn=!soundOn;

document.getElementById(
"soundBtn"
).textContent=
soundOn ? "ON" : "OFF";

}



/* MOVE BALL */

function moveBall(){

const maxX=
game.clientWidth-
ball.offsetWidth;

const maxY=
game.clientHeight-
ball.offsetHeight;

const x=Math.random()*maxX;

const y=Math.random()*maxY;

ball.style.left=x+"px";

ball.style.top=y+"px";

}



/* LEVEL */

function updateLevel(){

level=
Math.floor(score/10)+1;

levelText.textContent=level;


let size=
65-((level-1)*5);

if(size<35)size=35;

ball.style.width=size+"px";

ball.style.height=size+"px";


clearInterval(moveTimer);


let speed=
900-((level-1)*100);

if(speed<300)speed=300;


moveTimer=
setInterval(
moveBall,
speed
);

}



/* START GAME */

function startGame(){

score=0;
time=30;
level=1;
lives=3;

playing=true;


scoreText.textContent=score;
timeText.textContent=time;
levelText.textContent=level;
livesText.textContent=lives;


message.style.display="none";

ball.style.display="block";

moveBall();

updateLevel();

clearInterval(timer);


timer=
setInterval(function(){

time--;

timeText.textContent=time;

if(time<=0){

endGame();

}

},1000);


playSound(600,.15);

}



/* GAME OVER */

function endGame(){

playing=false;

clearInterval(timer);

clearInterval(moveTimer);

ball.style.display="none";


if(score>bestScore){

bestScore=score;

localStorage.setItem(
"bestScore",
bestScore
);

bestText.textContent=bestScore;

message.innerHTML=
"🏆 NEW HIGH SCORE!<br>"+
"Score: "+score;

}else{

message.innerHTML=
"🎉 GAME OVER!<br>"+
"Score: "+score+
"<br>🏆 Best: "+bestScore;

}


message.style.display="block";

playSound(250,.5);

}



/* BALL TAP */

ball.addEventListener(
"click",
function(){

if(!playing)return;

score++;

scoreText.textContent=score;

playSound(800,.08);

updateLevel();

moveBall();

}
);



/* MISS */

game.addEventListener(
"click",
function(event){

if(!playing)return;

if(event.target!==ball){

lives--;

livesText.textContent=lives;

playSound(200,.2);


if(lives<=0){

endGame();

}

}

});

</script>

</body>
</html>
